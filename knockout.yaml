structured_knockout:
  rounds:
    # round number
    0:
      display_name: Heats
      match_slots:
        # match number within the round
        0:
          A:
            display_name: Qualifier 1
            teams:
            - seed: 3
            - seed: 5
            - seed: 8
            - seed: 10
          B:
            display_name: Qualifier 2
            teams:
            - seed: 4
            - seed: 6
            - seed: 7
            - seed: 9
    1:
      match_slots:
        0:
          A:
            teams:
            # Reference a seeded team directly. Seeds are 1-indexed.
            - seed: 2
            # Reference the outcome from a previous knockout match. Positions are 0-indexed.
            - {round: 0, slot: 0, arena: A, position: 0}
            - {round: 0, slot: 0, arena: A, position: 2}
            - {round: 0, slot: 0, arena: B, position: 1}
        1:
          A:
            teams:
            - seed: 1
            - {round: 0, slot: 0, arena: A, position: 1}
            - {round: 0, slot: 0, arena: B, position: 0}
            - {round: 0, slot: 0, arena: B, position: 2}
    2:
      display_name: Finals
      match_slots:
        0:
          A:
            teams:
            - {round: 1, slot: 0, arena: A, position: 0}
            - {round: 1, slot: 0, arena: A, position: 1}
            - {round: 1, slot: 1, arena: A, position: 0}
            - {round: 1, slot: 1, arena: A, position: 1}
